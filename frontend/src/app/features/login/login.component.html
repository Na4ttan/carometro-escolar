<section class="login-layout">
  <div class="intro">
    <span class="eyebrow">CARÔMETRO ESCOLAR</span>
    <h1>Um jeito simples de cuidar de cada rosto.</h1>
  </div>
  <form class="panel login-panel" (ngSubmit)="entrar()">
    <div class="panel-heading">
      <span class="eyebrow">BEM-VINDA(O)</span>
      <h2>Acesse o sistema</h2>
    </div>
    <label>
      Usuário ou E-mail
      <input
        name="username"
        type="text"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        autocomplete="username"
        placeholder="Usuário da escola ou e-mail do professor"
        required
      />
    </label>
    <label>
      Senha
      <input
        name="password"
        type="password"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        autocomplete="current-password"
        placeholder="Digite a senha"
        required
      />
    </label>
    @if (erro()) {
      <div class="notice notice-error" role="alert">{{ erro() }}</div>
    }
    <button class="button button-primary" type="submit" style="width:100%">Entrar</button>
  </form>
</section>
