<section class="login-layout">
  <div class="intro">
    <span class="eyebrow">CARÔMETRO ESCOLAR</span>
    <h1>Um jeito simples de cuidar de cada rosto.</h1>
  </div>
  <form class="panel login-panel" (ngSubmit)="entrar()">
    <div class="panel-heading">
      <span class="eyebrow">BEM-VINDA(O)</span>
      <h2>Acesse o sistema</h2>
    </div>
    <label>
      Usuário ou E-mail
      <input
        name="username"
        type="text"
        [ngModel]="username()"
        (ngModelChange)="username.set($event)"
        autocomplete="username"
        placeholder="Usuário da escola ou e-mail do professor"
        required
      />
    </label>
    <label>
      Senha
      <div class="input-senha">
        <input
          name="password"
          [type]="mostrarSenha() ? 'text' : 'password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          autocomplete="current-password"
          placeholder="Digite a senha"
          required
        />
        <button type="button" class="btn-olho" (click)="mostrarSenha.set(!mostrarSenha())" [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'">
          @if (mostrarSenha()) {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          }
        </button>
      </div>
    </label>
    @if (erro()) {
      <div class="notice notice-error" role="alert">{{ erro() }}</div>
    }
    <button class="button button-primary" type="submit" style="width:100%">Entrar</button>
  </form>
</section>
