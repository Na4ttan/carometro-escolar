<main class="page">
  <header class="topbar">
    <a class="brand" routerLink="/" aria-label="Carômetro Escolar - início">
      <span class="brand-mark">C</span>
      <span>carômetro escolar</span>
    </a>
    @if (authService.estaLogado()) {
      @if (authService.perfil()?.tipo === 'escola') {
        <nav class="main-nav" aria-label="Navegação principal">
          <a
            routerLink="/inicio"
            routerLinkActive="active"
            #rlaInicio="routerLinkActive"
            [attr.aria-current]="rlaInicio.isActive ? 'page' : null"
          >Início</a>
          <a
            routerLink="/consulta"
            routerLinkActive="active"
            #rlaConsulta="routerLinkActive"
            [attr.aria-current]="rlaConsulta.isActive ? 'page' : null"
          >Consulta</a>
        </nav>
      } @else if (authService.perfil()?.tipo === 'professor') {
        <nav class="main-nav" aria-label="Navegação principal">
          <a
            routerLink="/consulta"
            routerLinkActive="active"
            #rlaCarometro="routerLinkActive"
            [attr.aria-current]="rlaCarometro.isActive ? 'page' : null"
          >Carômetro</a>
        </nav>
      }
    }
    <div class="topbar-actions">
      <button
        class="button button-quiet theme-toggle"
        type="button"
        (click)="temaService.alternar()"
        [attr.aria-pressed]="temaService.tema() === 'escuro'"
        [attr.aria-label]="temaService.tema() === 'claro' ? 'Ativar tema escuro' : 'Ativar tema claro'"
        [title]="temaService.tema() === 'claro' ? 'Ativar tema escuro' : 'Ativar tema claro'"
      >
        <span aria-hidden="true">{{ temaService.tema() === 'claro' ? '☾' : '☀' }}</span>
        <span>{{ temaService.tema() === 'claro' ? 'Tema escuro' : 'Tema claro' }}</span>
      </button>
      @if (authService.estaLogado()) {
        <button class="button button-quiet" type="button" (click)="sair()">Sair</button>
      }
    </div>
  </header>
  <router-outlet />
</main>
